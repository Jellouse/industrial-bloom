<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Shop — Industrial Bloom</title>
    <meta name="description" content="Shop the Industrial Bloom vase collection.">
    <script>
      document.documentElement.classList.add("is-loading");
    </script>
    <link rel="stylesheet" href="shop.css?v=115">
  </head>
  <body>
    <div class="site-loader" aria-hidden="true">
      <div class="loader-mask"></div>
    </div>

    <header class="shop-header is-at-top">
      <a class="brand" href="../" aria-label="Industrial Bloom home">
        <img class="shop-logo" src="../assets/logo.png" width="1394" height="1394" alt="">
      </a>
    </header>

    <main>
      <section class="shop-intro">
        <p class="eyebrow">Objects for living things</p>
        <h1>Industrial Bloom</h1>
        <p>A series of vases accentuating the contrast between nature and industry.</p>
        <p class="mode-note" hidden></p>
      </section>
      <a class="explore" href="#products">Explore more below</a>

      <section id="products" class="product-grid" aria-live="polite" aria-busy="true"></section>
    </main>

    <div class="cart-backdrop" hidden></div>
    <div class="dock-scrim" aria-hidden="true"></div>
    <div class="shop-dock-positioner">
      <section class="shop-dock" aria-label="Product and cart controls" hidden>
        <div class="dock-morph">
          <aside id="product-info" class="product-info" role="dialog" aria-modal="true" aria-label="Product information" aria-hidden="true" tabindex="-1">
            <button class="info-close" type="button">Close</button>
            <div class="product-info-copy">
              <p class="info-kicker">Object information</p>
              <h2 class="info-title"></h2>
              <p class="info-description"></p>
            </div>
            <figure class="technical-figure">
              <div class="technical-stage">
                <img class="technical-image" alt="">
              </div>
            </figure>
            <button class="info-claim" type="button">
              <span>Claim</span>
              <span class="info-edition"></span>
            </button>
          </aside>
          <aside id="cart" class="cart" role="dialog" aria-modal="true" aria-label="Shopping cart" aria-hidden="true" tabindex="-1">
            <button class="cart-close" type="button" aria-label="Close cart">Close</button>
            <div class="cart-items"></div>
            <p class="cart-error" role="alert"></p>
            <button class="checkout" type="button">Check out</button>
          </aside>
        </div>
        <div class="dock-summary">
          <div class="dock-product-copy">
            <strong class="dock-product-name"></strong>
            <p class="dock-product-description"></p>
          </div>
          <div class="dock-actions">
            <button class="info-toggle" type="button" aria-controls="product-info" aria-expanded="false" aria-label="Show product information">
              <span aria-hidden="true"></span>
            </button>
            <div class="dock-primary">
              <button class="dock-add" type="button">
                <span class="dock-fill" aria-hidden="true">
                  <svg class="dock-fill-svg" width="100%" height="100%">
                    <rect class="dock-fill-shape" fill="white" />
                  </svg>
                </span>
                <svg class="dock-outline" width="100%" height="100%" aria-hidden="true">
                  <defs>
                    <mask id="dock-outline-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse">
                      <rect class="dock-outline-mask-base" fill="white" />
                      <circle class="dock-outline-mask-hole" fill="black" />
                    </mask>
                  </defs>
                  <rect class="dock-outline-shape" mask="url(#dock-outline-mask)" />
                </svg>
                <span class="claim-label">Claim</span>
                <span class="dock-edition"></span>
              </button>
              <div class="cart-toggle-slot">
                <button class="cart-toggle" type="button" aria-controls="cart" aria-expanded="false">
                  <svg class="selection-surface" width="100%" height="100%" aria-hidden="true">
                    <defs>
                      <mask id="selection-surface-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse">
                        <rect class="selection-surface-mask-base" fill="white" />
                        <circle class="selection-surface-mask-hole" fill="black" />
                      </mask>
                    </defs>
                    <rect class="selection-surface-shape" fill="white" mask="url(#selection-surface-mask)" />
                  </svg>
                  <span class="selection-label"><span class="selection-prefix">Added to&nbsp;</span><span class="selection-text">Your selection</span></span>
                  <span class="cart-count">0</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <footer class="shop-footer">
      <span>Part of Humansize CORP.</span>
      <a href="admin/">Manage shop</a>
    </footer>
    <script src="shop-storage.js?v=1"></script>
    <script src="shop.js?v=93"></script>
  </body>
</html>
